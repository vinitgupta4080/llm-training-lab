html&gt;body{padding:0}&lt;/style&gt;

&lt;body&gt;

    &lt;button class=&quot;btn&quot; type=&quot;button&quot; data-topic=&quot;comparison&quot; aria-pressed=&quot;false&quot;&gt;Compare&lt;/button&gt;
    &lt;button class=&quot;btn&quot; type=&quot;button&quot; data-topic=&quot;learningrate&quot; aria-pressed=&quot;false&quot;&gt;Learning rate&lt;/button&gt;
    &lt;button class=&quot;btn&quot; type=&quot;button&quot; data-topic=&quot;stability&quot; aria-pressed=&quot;false&quot;&gt;Signal stability&lt;/button&gt;
    &lt;button class=&quot;btn&quot; type=&quot;button&quot; data-topic=&quot;distributed&quot; aria-pressed=&quot;false&quot;&gt;GPU preview&lt;/button&gt;
  &lt;/div&gt;
  &lt;section class=&quot;lesson&quot; aria-live=&quot;polite&quot;&gt;&lt;/section&gt;

&lt;style&gt;
  #module-02-revision-hub{display:grid;gap:18px;width:100%}
  #module-02-revision-hub .lesson{display:grid;gap:16px}
  #module-02-revision-hub .flow{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}

  #module-02-revision-hub .equation{text-align:center;padding:12px;border-radius:8px;background:var(--muted)}

  #module-02-revision-hub table{width:100%;border-collapse:collapse}

  #module-02-revision-hub pre{margin:0;white-space:pre-wrap}

  @media(max-width:520px){#module-02-revision-hub .two{grid-template-columns:1fr}}
&lt;/style&gt;
&lt;script&gt;
(() =&gt; {
  const root=document.getElementById(&#x27;module-02-revision-hub&#x27;);
  const lessons={
    gradient:`
      &lt;div&gt;&lt;h2&gt;Gradient: local rate of loss change&lt;/h2&gt;&lt;p&gt;The loss tells how wrong the model is. The gradient tells how a tiny parameter change affects that loss.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;equation&quot;&gt;&lt;code&gt;L=x² &amp;nbsp; | &amp;nbsp; dL/dx=2x&lt;/code&gt;&lt;/div&gt;
      &lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;x&lt;/th&gt;&lt;th&gt;loss x²&lt;/th&gt;&lt;th&gt;gradient 2x&lt;/th&gt;&lt;th&gt;loss-reducing direction&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
        &lt;tr&gt;&lt;td&gt;−3&lt;/td&gt;&lt;td&gt;9&lt;/td&gt;&lt;td&gt;−6&lt;/td&gt;&lt;td&gt;increase x toward 0&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;3&lt;/td&gt;&lt;td&gt;9&lt;/td&gt;&lt;td&gt;6&lt;/td&gt;&lt;td&gt;decrease x toward 0&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;&lt;/table&gt;
      &lt;div class=&quot;two&quot;&gt;&lt;div class=&quot;card&quot;&gt;&lt;b&gt;Finite difference&lt;/b&gt;&lt;p&gt;&lt;code&gt;(f(x+ε)-f(x))/ε&lt;/code&gt; estimates the slope.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;b&gt;Exact derivative&lt;/b&gt;&lt;p&gt;Autograd applies derivative rules and the chain rule.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;check&quot;&gt;&lt;b&gt;Self-check:&lt;/b&gt; At x=−4, gradient is −8, so gradient descent moves x upward.&lt;/div&gt;`,
    autograd:`
      &lt;div&gt;&lt;h2&gt;Forward pass and backward pass&lt;/h2&gt;&lt;p&gt;The forward pass calculates a scalar objective and records how it was made. Backward traverses those operations in reverse.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;flow&quot;&gt;&lt;span class=&quot;node&quot;&gt;parameter w&lt;/span&gt;&lt;span&gt;→&lt;/span&gt;&lt;span class=&quot;node&quot;&gt;prediction wx&lt;/span&gt;&lt;span&gt;→&lt;/span&gt;&lt;span class=&quot;node&quot;&gt;(target−prediction)²&lt;/span&gt;&lt;span&gt;→&lt;/span&gt;&lt;span class=&quot;node&quot;&gt;loss&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;flow&quot;&gt;&lt;span class=&quot;node&quot;&gt;loss&lt;/span&gt;&lt;span&gt;→&lt;/span&gt;&lt;span class=&quot;node&quot;&gt;square derivative&lt;/span&gt;&lt;span&gt;→&lt;/span&gt;&lt;span class=&quot;node&quot;&gt;matmul derivative&lt;/span&gt;&lt;span&gt;→&lt;/span&gt;&lt;span class=&quot;node&quot;&gt;w.grad&lt;/span&gt;&lt;/div&gt;
      &lt;pre&gt;&lt;code&gt;w = torch.tensor(2.0, requires_grad=True)
prediction = w * x
loss = (target - prediction) ** 2
loss.backward()       # computes and accumulates w.grad&lt;/code&gt;&lt;/pre&gt;
      &lt;div class=&quot;two&quot;&gt;&lt;div class=&quot;card&quot;&gt;&lt;b&gt;Scalar value&lt;/b&gt;&lt;p&gt;&lt;code&gt;loss.item()&lt;/code&gt; reports the number.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;b&gt;Computation graph&lt;/b&gt;&lt;p&gt;&lt;code&gt;loss.grad_fn&lt;/code&gt; links the scalar back to parameters.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;check&quot;&gt;&lt;b&gt;Remember:&lt;/b&gt; &lt;code&gt;backward()&lt;/code&gt; calculates gradients. It does not update parameters.&lt;/div&gt;`,
    batch:`
      &lt;div&gt;&lt;h2&gt;Batches, token vectors, and mean loss&lt;/h2&gt;&lt;p&gt;A token representation tensor uses &lt;code&gt;[B,T,C]&lt;/code&gt;: batches, token positions, and vector dimensions.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;equation&quot;&gt;&lt;code&gt;[B,T,Cin] @ [Cin,Cout] → [B,T,Cout]&lt;/code&gt;&lt;/div&gt;
      &lt;div class=&quot;two&quot;&gt;&lt;div class=&quot;card&quot;&gt;&lt;b&gt;Input&lt;/b&gt;&lt;p&gt;Every &lt;code&gt;inputs[b,t]&lt;/code&gt; is one &lt;code&gt;Cin&lt;/code&gt;-dimensional token vector.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;b&gt;Shared weight&lt;/b&gt;&lt;p&gt;The same &lt;code&gt;[Cin,Cout]&lt;/code&gt; matrix transforms every token.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;pre&gt;&lt;code&gt;predictions = inputs @ weight
squared_errors = (targets - predictions) ** 2
mean_loss = squared_errors.mean()
mean_loss.backward()&lt;/code&gt;&lt;/pre&gt;
      &lt;p&gt;Mean loss first squares every individual error, then averages. Do not add raw errors before squaring because positive and negative errors can cancel.&lt;/p&gt;
      &lt;div class=&quot;check&quot;&gt;&lt;b&gt;Shape rule:&lt;/b&gt; &lt;code&gt;weight.grad.shape == weight.shape&lt;/code&gt;. Batch and token contributions combine at corresponding weight positions.&lt;/div&gt;`,
    accumulation:`
      &lt;div&gt;&lt;h2&gt;Gradient accumulation and microbatches&lt;/h2&gt;&lt;p&gt;Backward adds into each leaf parameter’s persistent &lt;code&gt;.grad&lt;/code&gt; bucket.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;equation&quot;&gt;&lt;code&gt;stored grad ← stored grad + new grad&lt;/code&gt;&lt;/div&gt;
      &lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Action&lt;/th&gt;&lt;th&gt;x.grad at x=−3&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
        &lt;tr&gt;&lt;td&gt;first backward&lt;/td&gt;&lt;td&gt;−6&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;second backward without clearing&lt;/td&gt;&lt;td&gt;−12&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;clear, then backward&lt;/td&gt;&lt;td&gt;−6&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;&lt;/table&gt;
      &lt;p&gt;For K equal microbatches whose individual losses are means, divide each microbatch loss by K before backward.&lt;/p&gt;
      &lt;pre&gt;&lt;code&gt;optimizer.zero_grad(set_to_none=True)
for microbatch in microbatches:
    loss = mean_loss(microbatch) / len(microbatches)
    loss.backward()
optimizer.step()&lt;/code&gt;&lt;/pre&gt;
      &lt;div class=&quot;check&quot;&gt;&lt;b&gt;Unequal sizes:&lt;/b&gt; weight by actual examples or valid target tokens—not only the number of microbatches.&lt;/div&gt;`,
    optimizer:`
      &lt;div&gt;&lt;h2&gt;Optimizer: turn gradients into parameter updates&lt;/h2&gt;&lt;p&gt;The optimizer holds references to selected parameters. It reads their &lt;code&gt;.grad&lt;/code&gt; fields and applies an update rule.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;equation&quot;&gt;&lt;code&gt;SGD: parameter_new = parameter_old − learning_rate × gradient&lt;/code&gt;&lt;/div&gt;
      &lt;div class=&quot;flow&quot;&gt;&lt;span class=&quot;node&quot;&gt;zero_grad&lt;/span&gt;&lt;span&gt;→&lt;/span&gt;&lt;span class=&quot;node&quot;&gt;forward&lt;/span&gt;&lt;span&gt;→&lt;/span&gt;&lt;span class=&quot;node&quot;&gt;backward&lt;/span&gt;&lt;span&gt;→&lt;/span&gt;&lt;span class=&quot;node&quot;&gt;step&lt;/span&gt;&lt;/div&gt;
      &lt;pre&gt;&lt;code&gt;optimizer = torch.optim.SGD(model.parameters(), lr=0.1)

optimizer.zero_grad(set_to_none=True)
loss = calculate_loss(model(inputs), targets)
loss.backward()
optimizer.step()&lt;/code&gt;&lt;/pre&gt;
      &lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Memory&lt;/th&gt;&lt;th&gt;Lifetime&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
        &lt;tr&gt;&lt;td&gt;parameters&lt;/td&gt;&lt;td&gt;persistent&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;parameter gradients&lt;/td&gt;&lt;td&gt;until cleared&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;optimizer state&lt;/td&gt;&lt;td&gt;persistent&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;forward activations / saved tensors&lt;/td&gt;&lt;td&gt;normally until backward&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;&lt;/table&gt;
      &lt;div class=&quot;check&quot;&gt;&lt;b&gt;Why clear?&lt;/b&gt; &lt;code&gt;optimizer.step()&lt;/code&gt; reads gradients but intentionally leaves them stored so accumulation remains possible.&lt;/div&gt;`,
    sgd:`
      &lt;div&gt;&lt;h2&gt;Plain SGD: follow the current gradient&lt;/h2&gt;&lt;p&gt;SGD is the smallest useful optimizer. It needs the current parameter, current gradient, and learning rate—no direction history.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;equation&quot;&gt;&lt;code&gt;w_new = w − learning_rate × gradient&lt;/code&gt;&lt;/div&gt;
      &lt;div class=&quot;flow&quot;&gt;&lt;span class=&quot;node&quot;&gt;w = 5&lt;/span&gt;&lt;span&gt;→&lt;/span&gt;&lt;span class=&quot;node&quot;&gt;gradient = 10&lt;/span&gt;&lt;span&gt;→&lt;/span&gt;&lt;span class=&quot;node&quot;&gt;LR = 0.1&lt;/span&gt;&lt;span&gt;→&lt;/span&gt;&lt;span class=&quot;node&quot;&gt;w_new = 4&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;two&quot;&gt;&lt;div class=&quot;card&quot;&gt;&lt;b&gt;Why use it?&lt;/b&gt;&lt;p&gt;It is transparent, cheap, and a strong baseline. Every update can be calculated by hand.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;b&gt;What can go wrong?&lt;/b&gt;&lt;p&gt;One global learning rate may be too large for a steep direction and too small for a shallow direction.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Persistent item per parameter&lt;/th&gt;&lt;th&gt;Extra state elements&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
        &lt;tr&gt;&lt;td&gt;weight&lt;/td&gt;&lt;td&gt;0 optimizer-state elements&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;&lt;/table&gt;
      &lt;pre&gt;&lt;code&gt;optimizer = torch.optim.SGD([weight], lr=0.01)&lt;/code&gt;&lt;/pre&gt;
      &lt;div class=&quot;check&quot;&gt;&lt;b&gt;Remember:&lt;/b&gt; SGD does not mean “update every training example separately.” Batches first combine contributions into &lt;code&gt;weight.grad&lt;/code&gt;; SGD then consumes that gradient.&lt;/div&gt;`,
    momentum:`
      &lt;div&gt;&lt;h2&gt;SGD with momentum: remember recent direction&lt;/h2&gt;&lt;p&gt;A current gradient can zigzag. Momentum stores a velocity so consistent directions build speed while alternating directions partially cancel.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;equation&quot;&gt;&lt;code&gt;velocity = momentum × old_velocity + current_gradient&lt;/code&gt;&lt;br&gt;&lt;code&gt;w_new = w − learning_rate × velocity&lt;/code&gt;&lt;/div&gt;
      &lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Step&lt;/th&gt;&lt;th&gt;Gradient&lt;/th&gt;&lt;th&gt;Velocity at momentum 0.9&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
        &lt;tr&gt;&lt;td&gt;1&lt;/td&gt;&lt;td&gt;10&lt;/td&gt;&lt;td&gt;10&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;2&lt;/td&gt;&lt;td&gt;6&lt;/td&gt;&lt;td&gt;0.9 × 10 + 6 = 15&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;3&lt;/td&gt;&lt;td&gt;−2.3&lt;/td&gt;&lt;td&gt;0.9 × 15 − 2.3 = 11.2&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;&lt;/table&gt;
      &lt;div class=&quot;two&quot;&gt;&lt;div class=&quot;card&quot;&gt;&lt;b&gt;Benefit&lt;/b&gt;&lt;p&gt;Accelerates along a direction that remains useful and can reduce narrow-valley zigzagging.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;b&gt;Risk&lt;/b&gt;&lt;p&gt;Stored velocity can overshoot. In our LR 0.018 experiment, momentum lost to plain SGD; at LR 0.005, it won.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;pre&gt;&lt;code&gt;optimizer = torch.optim.SGD(
    [weight], lr=0.01, momentum=0.9
)&lt;/code&gt;&lt;/pre&gt;
      &lt;div class=&quot;check&quot;&gt;&lt;b&gt;Memory:&lt;/b&gt; momentum stores one velocity tensor with the same shape as every optimized weight tensor.&lt;/div&gt;`,
    adam:`
      &lt;div&gt;&lt;h2&gt;Adam: direction history plus scale history&lt;/h2&gt;&lt;p&gt;Different weight dimensions can receive gradients with very different sizes. Adam adapts the step independently at every parameter position.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;equation&quot;&gt;&lt;code&gt;m = direction history &amp;nbsp; | &amp;nbsp; v = squared-gradient-size history&lt;/code&gt;&lt;br&gt;&lt;code&gt;update ≈ learning_rate × direction / size&lt;/code&gt;&lt;/div&gt;
      &lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Stored state&lt;/th&gt;&lt;th&gt;What it remembers&lt;/th&gt;&lt;th&gt;Shape&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
        &lt;tr&gt;&lt;td&gt;&lt;code&gt;m&lt;/code&gt; / &lt;code&gt;exp_avg&lt;/code&gt;&lt;/td&gt;&lt;td&gt;moving average of gradients&lt;/td&gt;&lt;td&gt;same as weight&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;&lt;code&gt;v&lt;/code&gt; / &lt;code&gt;exp_avg_sq&lt;/code&gt;&lt;/td&gt;&lt;td&gt;moving average of squared gradients&lt;/td&gt;&lt;td&gt;same as weight&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;&lt;/table&gt;
      &lt;div class=&quot;flow&quot;&gt;&lt;span class=&quot;node&quot;&gt;gradient [10, 500]&lt;/span&gt;&lt;span&gt;→&lt;/span&gt;&lt;span class=&quot;node&quot;&gt;separate m and v per position&lt;/span&gt;&lt;span&gt;→&lt;/span&gt;&lt;span class=&quot;node&quot;&gt;roughly normalized directions [1, 1]&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;two&quot;&gt;&lt;div class=&quot;card&quot;&gt;&lt;b&gt;Why useful?&lt;/b&gt;&lt;p&gt;A historically large-gradient dimension is scaled down relative to a small-gradient dimension. One raw gradient cannot dominate only because of units or curvature.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;b&gt;What it does not promise&lt;/b&gt;&lt;p&gt;The update is not always exactly ±1, and Adam is not automatically best at the same numeric learning rate as SGD.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;pre&gt;&lt;code&gt;optimizer = torch.optim.Adam([weight], lr=0.001)&lt;/code&gt;&lt;/pre&gt;
      &lt;div class=&quot;check&quot;&gt;&lt;b&gt;Memory:&lt;/b&gt; Adam usually stores two full-size floating-point state tensors per optimized parameter, plus a small step counter. That can be a major LLM training cost.&lt;/div&gt;`,
    adamw:`
      &lt;div&gt;&lt;h2&gt;AdamW: Adam plus decoupled weight decay&lt;/h2&gt;&lt;p&gt;Adam learns from the task gradient. AdamW also applies a separate gentle pull toward zero, controlled by &lt;code&gt;weight_decay&lt;/code&gt;.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;equation&quot;&gt;&lt;code&gt;w_new = w − AdamUpdate(gradient) − learning_rate × weight_decay × w&lt;/code&gt;&lt;/div&gt;
      &lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Example&lt;/th&gt;&lt;th&gt;Adam part&lt;/th&gt;&lt;th&gt;Decay part&lt;/th&gt;&lt;th&gt;New weight&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
        &lt;tr&gt;&lt;td&gt;w=10, gradient=0&lt;/td&gt;&lt;td&gt;0&lt;/td&gt;&lt;td&gt;−0.01&lt;/td&gt;&lt;td&gt;9.99&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;w=10, target=8&lt;/td&gt;&lt;td&gt;−0.10&lt;/td&gt;&lt;td&gt;−0.01&lt;/td&gt;&lt;td&gt;9.89&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;w=10, target=12&lt;/td&gt;&lt;td&gt;+0.10&lt;/td&gt;&lt;td&gt;−0.01&lt;/td&gt;&lt;td&gt;10.09&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;&lt;/table&gt;
      &lt;div class=&quot;two&quot;&gt;&lt;div class=&quot;card&quot;&gt;&lt;b&gt;Why shrink?&lt;/b&gt;&lt;p&gt;It discourages the training solution from depending on unnecessarily large weights. Task gradients can still maintain or grow weights that help prediction.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;b&gt;Too much decay&lt;/b&gt;&lt;p&gt;The pull toward zero can fight useful task gradients and cause underfitting. Longer training does not remove this bias because decay acts every step.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;pre&gt;&lt;code&gt;optimizer = torch.optim.AdamW(
    [weight], lr=0.001, weight_decay=0.01
)&lt;/code&gt;&lt;/pre&gt;
      &lt;div class=&quot;check&quot;&gt;&lt;b&gt;PyTorch edge case:&lt;/b&gt; a zero gradient tensor permits the AdamW decay update. If &lt;code&gt;weight.grad is None&lt;/code&gt;, the optimizer skips that parameter, including decay.&lt;/div&gt;`,
    comparison:`
      &lt;div&gt;&lt;h2&gt;How to compare and choose optimizers&lt;/h2&gt;&lt;p&gt;There is no universal winner. First compare mechanisms at identical settings; then tune each optimizer fairly within the same total search and final-run budget.&lt;/p&gt;&lt;/div&gt;
      &lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Optimizer&lt;/th&gt;&lt;th&gt;Uses current gradient&lt;/th&gt;&lt;th&gt;History per weight&lt;/th&gt;&lt;th&gt;Weight decay&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
        &lt;tr&gt;&lt;td&gt;SGD&lt;/td&gt;&lt;td&gt;yes&lt;/td&gt;&lt;td&gt;none&lt;/td&gt;&lt;td&gt;optional coupled L2-style setting&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;SGD + momentum&lt;/td&gt;&lt;td&gt;yes&lt;/td&gt;&lt;td&gt;1 velocity&lt;/td&gt;&lt;td&gt;optional coupled L2-style setting&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Adam&lt;/td&gt;&lt;td&gt;yes&lt;/td&gt;&lt;td&gt;m and v&lt;/td&gt;&lt;td&gt;not decoupled in classic Adam&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;AdamW&lt;/td&gt;&lt;td&gt;yes&lt;/td&gt;&lt;td&gt;m and v&lt;/td&gt;&lt;td&gt;separate direct shrinkage&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;&lt;/table&gt;
      &lt;h3&gt;Our tuned 50-update toy experiment&lt;/h3&gt;
      &lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Optimizer&lt;/th&gt;&lt;th&gt;Best tested LR&lt;/th&gt;&lt;th&gt;Final loss&lt;/th&gt;&lt;th&gt;Optimizer-state elements&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
        &lt;tr&gt;&lt;td&gt;plain SGD&lt;/td&gt;&lt;td&gt;0.019&lt;/td&gt;&lt;td&gt;0.552536&lt;/td&gt;&lt;td&gt;0&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;momentum&lt;/td&gt;&lt;td&gt;0.017&lt;/td&gt;&lt;td&gt;0.303671&lt;/td&gt;&lt;td&gt;2&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Adam&lt;/td&gt;&lt;td&gt;0.5&lt;/td&gt;&lt;td&gt;0.029599&lt;/td&gt;&lt;td&gt;4&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;&lt;/table&gt;
      &lt;p&gt;The search evaluated 28 candidates: 1,400 optimizer steps, or 28× the compute of one final 50-step run. Hyperparameter search is part of the cost.&lt;/p&gt;
      &lt;div class=&quot;two&quot;&gt;&lt;div class=&quot;card&quot;&gt;&lt;b&gt;Fair comparison&lt;/b&gt;&lt;p&gt;Same data, initialization, number of updates or tokens, validation set, seeds, and comparable tuning budget.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;b&gt;Production decision&lt;/b&gt;&lt;p&gt;Compare validation quality, stability, time-to-quality, throughput, optimizer memory, and total tuning cost—not loss alone.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;check&quot;&gt;&lt;b&gt;Limitation:&lt;/b&gt; this two-parameter toy result explains optimizer mechanics. It does not prove Adam wins on every model or LLM workload.&lt;/div&gt;`,
    learningrate:`
      &lt;div&gt;&lt;h2&gt;Learning rate and compute budget&lt;/h2&gt;&lt;p&gt;The learning rate scales every gradient update. We select it by controlled experiments, not from the number alone.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;equation&quot;&gt;&lt;code&gt;parameter_new = parameter_old − learning_rate × gradient&lt;/code&gt;&lt;/div&gt;
      &lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Learning rate&lt;/th&gt;&lt;th&gt;20-step validation loss&lt;/th&gt;&lt;th&gt;Behavior&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
        &lt;tr&gt;&lt;td&gt;0.0001&lt;/td&gt;&lt;td&gt;31.9640&lt;/td&gt;&lt;td&gt;stable but too slow&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;0.001&lt;/td&gt;&lt;td&gt;5.29169&lt;/td&gt;&lt;td&gt;stable but slow&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;0.01&lt;/td&gt;&lt;td&gt;0.091921&lt;/td&gt;&lt;td&gt;effective&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;0.03&lt;/td&gt;&lt;td&gt;0.084965&lt;/td&gt;&lt;td&gt;best tested under this budget&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;0.1&lt;/td&gt;&lt;td&gt;1.10e26&lt;/td&gt;&lt;td&gt;unstable&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;&lt;/table&gt;
      &lt;div class=&quot;two&quot;&gt;&lt;div class=&quot;card&quot;&gt;&lt;b&gt;Too small&lt;/b&gt;&lt;p&gt;Moves in the right direction but may run out of steps before reaching the target quality.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;b&gt;Too large&lt;/b&gt;&lt;p&gt;Overshoots, oscillates, or diverges because every update is oversized.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Steps at LR 0.001&lt;/th&gt;&lt;th&gt;Training loss&lt;/th&gt;&lt;th&gt;Relative compute&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
        &lt;tr&gt;&lt;td&gt;20&lt;/td&gt;&lt;td&gt;9.77733&lt;/td&gt;&lt;td&gt;1×&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;200&lt;/td&gt;&lt;td&gt;0.10553&lt;/td&gt;&lt;td&gt;10×&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2,000&lt;/td&gt;&lt;td&gt;0.07410&lt;/td&gt;&lt;td&gt;100×&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;&lt;/table&gt;
      &lt;div class=&quot;check&quot;&gt;&lt;b&gt;Diminishing returns:&lt;/b&gt; the second 10× compute increase produced a much smaller loss improvement. Choose the cheapest configuration that meets the required validation quality.&lt;/div&gt;`,
    stability:`
      &lt;div&gt;&lt;h2&gt;Keeping signals and gradients useful&lt;/h2&gt;&lt;p&gt;Deep networks repeatedly transform activations in the forward pass and gradients in the backward pass. We want useful values—not systematic collapse toward zero or growth toward infinity.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;equation&quot;&gt;&lt;code&gt;forward: useful activations &amp;nbsp; | &amp;nbsp; backward: useful gradients&lt;/code&gt;&lt;/div&gt;
      &lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Mechanism&lt;/th&gt;&lt;th&gt;Core math&lt;/th&gt;&lt;th&gt;When and why&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
        &lt;tr&gt;&lt;td&gt;Xavier initialization&lt;/td&gt;&lt;td&gt;&lt;code&gt;Var(W)=2/(fan_in+fan_out)&lt;/code&gt;&lt;br&gt;&lt;code&gt;Std(W)=√Var(W)&lt;/code&gt;&lt;/td&gt;&lt;td&gt;Once before training: chooses a starting weight scale that reduces immediate fading or explosion.&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Layer normalization&lt;/td&gt;&lt;td&gt;&lt;code&gt;μ=mean(h)&lt;/code&gt;&lt;br&gt;&lt;code&gt;σ²=mean((h−μ)²)&lt;/code&gt;&lt;br&gt;&lt;code&gt;ĥ=(h−μ)/√(σ²+ε)&lt;/code&gt;&lt;br&gt;&lt;code&gt;y=γĥ+β&lt;/code&gt;&lt;/td&gt;&lt;td&gt;Every forward pass: controls each token’s hidden-activation scale while learned &lt;code&gt;γ&lt;/code&gt; and &lt;code&gt;β&lt;/code&gt; restore useful scale and shift.&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Residual connection&lt;/td&gt;&lt;td&gt;&lt;code&gt;y=x+F(x)&lt;/code&gt;&lt;br&gt;&lt;code&gt;∂L/∂x=(∂L/∂y)(I+J_F)&lt;/code&gt;&lt;/td&gt;&lt;td&gt;Every forward and backward pass: the identity term &lt;code&gt;I&lt;/code&gt; gives signals and gradients a direct path around &lt;code&gt;F&lt;/code&gt;.&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Gradient clipping&lt;/td&gt;&lt;td&gt;&lt;code&gt;||g||₂=√Σgᵢ²&lt;/code&gt;&lt;br&gt;&lt;code&gt;g′=g·min(1, τ/(||g||₂+ε))&lt;/code&gt;&lt;/td&gt;&lt;td&gt;After backward, before the optimizer: limits an abnormal gradient to threshold &lt;code&gt;τ&lt;/code&gt; while preserving direction.&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Learning-rate control&lt;/td&gt;&lt;td&gt;&lt;code&gt;θ_new=θ−ηg′&lt;/code&gt;&lt;br&gt;&lt;code&gt;||Δθ||₂=η||g′||₂&lt;/code&gt;&lt;/td&gt;&lt;td&gt;Every optimizer step: &lt;code&gt;η&lt;/code&gt; turns the gradient into an actual parameter-movement size.&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;&lt;/table&gt;
      &lt;div class=&quot;flow&quot;&gt;&lt;span class=&quot;node&quot;&gt;initialize W&lt;/span&gt;&lt;span&gt;→&lt;/span&gt;&lt;span class=&quot;node&quot;&gt;normalize activation&lt;/span&gt;&lt;span&gt;→&lt;/span&gt;&lt;span class=&quot;node&quot;&gt;learn change + keep residual path&lt;/span&gt;&lt;span&gt;→&lt;/span&gt;&lt;span class=&quot;node&quot;&gt;backward&lt;/span&gt;&lt;span&gt;→&lt;/span&gt;&lt;span class=&quot;node&quot;&gt;clip if needed&lt;/span&gt;&lt;span&gt;→&lt;/span&gt;&lt;span class=&quot;node&quot;&gt;controlled optimizer step&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;two&quot;&gt;&lt;div class=&quot;card&quot;&gt;&lt;b&gt;Xavier example: W shape [3,2]&lt;/b&gt;&lt;p&gt;&lt;code&gt;fan_in=3&lt;/code&gt;, &lt;code&gt;fan_out=2&lt;/code&gt;, so variance is &lt;code&gt;2/(3+2)=0.4&lt;/code&gt; and standard deviation is &lt;code&gt;√0.4≈0.632&lt;/code&gt;. Individual weights are random values around zero with this spread.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;b&gt;LayerNorm example&lt;/b&gt;&lt;p&gt;For &lt;code&gt;h=[10,20,30]&lt;/code&gt;, &lt;code&gt;μ=20&lt;/code&gt;, &lt;code&gt;σ²=(100+0+100)/3≈66.67&lt;/code&gt;, and with &lt;code&gt;γ=1, β=0&lt;/code&gt;, the result is approximately &lt;code&gt;[-1.22,0,1.22]&lt;/code&gt;.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;two&quot;&gt;&lt;div class=&quot;card&quot;&gt;&lt;b&gt;Residual example&lt;/b&gt;&lt;p&gt;&lt;code&gt;x=[2,3]&lt;/code&gt; and &lt;code&gt;F(x)=[0.1,−0.2]&lt;/code&gt; give &lt;code&gt;y=[2.1,2.8]&lt;/code&gt;. If &lt;code&gt;F(x)≈0&lt;/code&gt;, then &lt;code&gt;y≈x&lt;/code&gt;, so the original signal survives.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;b&gt;Clipping + learning-rate example&lt;/b&gt;&lt;p&gt;For &lt;code&gt;g=[30,40]&lt;/code&gt;, &lt;code&gt;||g||₂=50&lt;/code&gt;. With &lt;code&gt;τ=1&lt;/code&gt;, &lt;code&gt;g′=[0.6,0.8]&lt;/code&gt;. With &lt;code&gt;η=0.1&lt;/code&gt;, the update is &lt;code&gt;Δθ=−[0.06,0.08]&lt;/code&gt; and has norm &lt;code&gt;0.1&lt;/code&gt;.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;two&quot;&gt;&lt;div class=&quot;card&quot;&gt;&lt;b&gt;LayerNorm acts on activations&lt;/b&gt;&lt;p&gt;First calculate &lt;code&gt;h=x@W+b&lt;/code&gt;, then normalize hidden state &lt;code&gt;h&lt;/code&gt;. Standard LayerNorm does not normalize weight matrix &lt;code&gt;W&lt;/code&gt;.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;b&gt;Zero is not automatically bad&lt;/b&gt;&lt;p&gt;One zero weight removes one connection’s contribution. If both &lt;code&gt;w=0&lt;/code&gt; and &lt;code&gt;∂L/∂w=0&lt;/code&gt;, then &lt;code&gt;w_new=0−η·0=0&lt;/code&gt;; the connection remains inactive.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;check&quot;&gt;&lt;b&gt;Symbols:&lt;/b&gt; &lt;code&gt;h&lt;/code&gt; hidden activation; &lt;code&gt;μ&lt;/code&gt; mean; &lt;code&gt;σ²&lt;/code&gt; variance; &lt;code&gt;ε&lt;/code&gt; small divide-by-zero guard; &lt;code&gt;γ,β&lt;/code&gt; learned LayerNorm scale and shift; &lt;code&gt;F&lt;/code&gt; learned layer; &lt;code&gt;J_F&lt;/code&gt; its Jacobian; &lt;code&gt;g&lt;/code&gt; gradient; &lt;code&gt;τ&lt;/code&gt; clipping threshold; &lt;code&gt;θ&lt;/code&gt; parameters; &lt;code&gt;η&lt;/code&gt; learning rate.&lt;/div&gt;
      &lt;div class=&quot;check&quot;&gt;&lt;b&gt;Key distinction:&lt;/b&gt; initialization creates a healthy starting scale; normalization and residual paths help throughout the network; clipping and learning-rate control protect parameter updates. These mechanisms cooperate but do different jobs.&lt;/div&gt;`,
    distributed:`
      &lt;div&gt;&lt;h2&gt;Multi-GPU preview — detailed study comes later&lt;/h2&gt;&lt;p&gt;This is orientation only. Tensor parallelism follows Transformer matrix operations; FSDP follows full training-memory accounting.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;two&quot;&gt;&lt;div class=&quot;card&quot;&gt;&lt;b&gt;DDP&lt;/b&gt;&lt;p&gt;Copy the full model on every GPU, split data, then average corresponding gradients.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;b&gt;FSDP&lt;/b&gt;&lt;p&gt;Shard parameters, gradients, and optimizer state; temporarily gather layer weights when needed.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;two&quot;&gt;&lt;div class=&quot;card&quot;&gt;&lt;b&gt;Tensor parallel&lt;/b&gt;&lt;p&gt;Split one large layer or matrix calculation; GPUs cooperate on the same calculation.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;b&gt;Pipeline parallel&lt;/b&gt;&lt;p&gt;Place different layer groups on different GPUs and stream microbatches through them.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;equation&quot;&gt;&lt;code&gt;FSDP mainly splits storage &amp;nbsp; | &amp;nbsp; Tensor parallel mainly splits one layer’s computation&lt;/code&gt;&lt;/div&gt;
      &lt;div class=&quot;check&quot;&gt;&lt;b&gt;For now:&lt;/b&gt; You are not expected to implement or derive these strategies yet.&lt;/div&gt;`
  };
  function render(topic){
    root.querySelector(&#x27;.lesson&#x27;).innerHTML=lessons[topic];
    root.querySelectorAll(&#x27;button[data-topic]&#x27;).forEach(button=&gt;{
      const active=button.dataset.topic===topic;
      button.classList.toggle(&#x27;btn-primary&#x27;,active);
      button.setAttribute(&#x27;aria-pressed&#x27;,String(active));
    });
  }
  root.querySelectorAll(&#x27;button[data-topic]&#x27;).forEach(button=&gt;button.addEventListener(&#x27;click&#x27;,()=&gt;render(button.dataset.topic)));
  render(&#x27;gradient&#x27;);
})();
&lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
